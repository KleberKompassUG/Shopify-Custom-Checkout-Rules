query CartPaymentMethodsTransformRunInput {
  shop {
    metafield(namespace: "$app", key: "payment_rule") {
      value
    }
  }
  cart {
    buyerIdentity {
      customer {
        hasAnyTag(tags: ["b2b"])
      }
    }
    deliveryGroups {
      deliveryAddress {
        company
      }
    }
  }
  paymentMethods {
    id
    name
  }
}