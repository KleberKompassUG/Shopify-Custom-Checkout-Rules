query CartPaymentMethodsTransformRunInput {
  cart {
    cost {
      totalAmount {
        amount
      }
    }
    buyerIdentity {
      customer {
        id
        hasAnyTag(tags: ["b2b"])
      }
    }
    deliveryGroups {
      deliveryAddress {
        company
      }
    }
  }
  paymentMethods {
    id
    name
  }
}